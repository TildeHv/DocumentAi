services:
  postgres:
    image: postgres:16-alpine
    container_name: documentai-db
    environment:
      POSTGRES_DB: documentai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Munk123
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:0.32.15
    container_name: documentai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "ollama serve &
      sleep 5 &&
      ollama pull llama3.2 &&
      wait"

volumes:
   ollama-data: